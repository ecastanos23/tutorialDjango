log_format upstreamlog '$remote_addr [$time_local] "$request" $status -> upstream=$upstream_addr';

upstream django_v1 {
    server web:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log upstreamlog;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Strangler: la compra v2 la atiende el microservicio Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # API v1 sigue en Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Fallback: admin y vistas HTML en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
